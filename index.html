<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MLSC Workshop Portal</title>
    <!--
      Flash-prevention script — runs synchronously before any CSS or JS
      is parsed. Reads the saved theme from localStorage and immediately
      adds the "dark" class to <html> so the first paint is correct.
      Must be inline; an external script would load too late.
    -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem("mlsc-theme");
          // Default is dark — only switch to light if the user explicitly saved "light"
          if (saved !== "light") {
            document.documentElement.classList.add("dark");
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
